# Resolving and unresolving a review thread. Not run: they change the PR.
# Introspected input for both: { threadId: ID!, clientMutationId: String }; the payload has
# `thread` (a PullRequestReviewThread) and `clientMutationId`.
mutation($threadId: ID!) {
  resolveReviewThread(input: { threadId: $threadId }) { thread { id isResolved } }
}

mutation($threadId: ID!) {
  unresolveReviewThread(input: { threadId: $threadId }) { thread { id isResolved } }
}

# Replies and new comments go over REST, which posts them at once rather than into a pending
# review. Not run: they notify people. `review-comment-rest.json` is a comment of the same
# schema both return with 201, read with `gh api repos/tamarinworks/atrium/pulls/comments/4146927460`.
#
# POST /repos/{owner}/{repo}/pulls/{number}/comments/{comment_id}/replies
#   { "body": "..." }
#   comment_id is the REST id (`databaseId`) of the thread's first comment; GitHub doesn't
#   take replies to replies.
#
# POST /repos/{owner}/{repo}/pulls/{number}/comments
#   { "body": "...", "commit_id": "<head oid>", "path": "...", "line": 42, "side": "RIGHT" }
#   line is a file line number on side, which must be in the PR's diff at commit_id.
#
# GraphQL's addPullRequestReviewThread "Adds a new thread to a pending Pull Request Review",
# and addPullRequestReviewThreadReply's only review argument is "the pending review to which
# the reply will belong", so neither is documented as posting outside a review.
