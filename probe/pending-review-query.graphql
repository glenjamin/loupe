query($owner: String!, $name: String!, $number: Int!, $viewer: String) {
  repository(owner: $owner, name: $name) {
    pullRequest(number: $number) {
      id
      pendingReview: reviews(first: 1, states: [PENDING], author: $viewer) { nodes { id body comments { totalCount } } }
      reviewThreads(first: 100) { nodes { ...ReviewThread } }
    }
  }
}

fragment ReviewThread on PullRequestReviewThread {
  id isResolved isOutdated path line startLine diffSide startDiffSide originalLine originalStartLine subjectType
  viewerCanReply viewerCanResolve viewerCanUnresolve
  resolvedBy { login }
  firstComment: comments(first: 1) { nodes { diffHunk } }
  comments(first: 100) { nodes { id databaseId bodyHTML createdAt isMinimized minimizedReason state author { login avatarUrl } } }
}
