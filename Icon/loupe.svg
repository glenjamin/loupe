<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Loupe</title>
  <defs>
    <linearGradient id="bg-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4DB6C9"/>
      <stop offset="1" stop-color="#1A5F8C"/>
    </linearGradient>
    <linearGradient id="rim-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD27A"/>
      <stop offset="1" stop-color="#D9821F"/>
    </linearGradient>
    <linearGradient id="handle-fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B5651A"/>
      <stop offset="0.5" stop-color="#E89A3A"/>
      <stop offset="1" stop-color="#9C5414"/>
    </linearGradient>
    <radialGradient id="glass-fill" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </radialGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="lens-clip">
      <circle cx="590" cy="450" r="140"/>
    </clipPath>

    <!-- Cat-octopus silhouette: head, ears and four curling tentacles, all drawn
         clockwise so the overlapping pieces merge into one shape. -->
    <path id="cat-shape" fill="#0B1220" d="
      M 235 470 A 215 215 0 1 1 665 470 A 215 215 0 1 1 235 470 Z
      M 290 330 L 262 190 Q 258 165 282 175 L 420 262 Z
      M 610 330 L 480 262 L 618 175 Q 642 165 638 190 Z
      M 340 590 L 370 640 A 110 110 0 0 1 151.7 659.1 A 29 29 0 0 1 208.8 649 A 52 52 0 0 0 312 640 Z
      M 393 650 L 437 650 L 437 760 A 72 72 0 0 1 294.1 772.5 A 22 22 0 0 1 337.4 764.9 A 28 28 0 0 0 393 760 Z
      M 507 650 L 507 760 A 28 28 0 0 0 562.6 764.9 A 22 22 0 0 1 605.9 772.5 A 72 72 0 0 1 463 760 L 463 650 Z
      M 560 590 L 588 640 A 52 52 0 0 0 691.2 649 A 29 29 0 0 1 748.3 659.1 A 110 110 0 0 1 530 640 Z"/>
  </defs>

  <g id="background" filter="url(#drop)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg-fill)"/>
  </g>

  <use id="cat" xlink:href="#cat-shape"/>

  <g id="lens">
    <g id="handle" transform="rotate(-60 590 450)">
      <rect x="545" y="605" width="90" height="165" rx="32" fill="url(#handle-fill)"/>
    </g>
    <!-- The cat again, magnified about the lens centre and seen only through
         the glass, with diff lines on its body that only the lens reveals. -->
    <g id="glass" clip-path="url(#lens-clip)">
      <circle cx="590" cy="450" r="140" fill="#7FD3E0"/>
      <use xlink:href="#cat-shape" transform="translate(590 450) scale(1.3) translate(-590 -450)"/>
      <g id="diff">
        <rect x="512" y="352" width="150" height="46" rx="12" fill="#3FB950"/>
        <rect x="512" y="427" width="175" height="46" rx="12" fill="#F85149"/>
        <rect x="512" y="502" width="120" height="46" rx="12" fill="#3FB950"/>
        <g fill="#0B1220">
          <rect x="524" y="370" width="30" height="10" rx="3"/>
          <rect x="534" y="360" width="10" height="30" rx="3"/>
          <rect x="524" y="445" width="30" height="10" rx="3"/>
          <rect x="524" y="520" width="30" height="10" rx="3"/>
          <rect x="534" y="510" width="10" height="30" rx="3"/>
        </g>
      </g>
      <circle cx="590" cy="450" r="140" fill="url(#glass-fill)"/>
    </g>
    <circle id="rim" cx="590" cy="450" r="155" fill="none" stroke="url(#rim-fill)" stroke-width="58"/>
    <path id="highlight" d="M486.6 412.4 A 110 110 0 0 1 552.4 346.6" fill="none" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="22" stroke-linecap="round"/>
  </g>
</svg>
